name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
      version_tag:
        description: 'Release version tag (e.g., v1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Environment and Keystore
        run: |
          # 1. Restore or create .env file for secrets plugin
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # 2. Restore debug.keystore from base64 if present, or generate a fresh debug keystore
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Make wrapper executable
          chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        id: prepare_apk
        run: |
          mkdir -p release-output
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" release-output/RootPurge.apk
          ls -lh release-output/
          echo "apk_path=release-output/RootPurge.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootPurge-APK
          path: release-output/RootPurge.apk
          retention-days: 14

      - name: Determine Release Tag
        id: tag_picker
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.version_tag }}" ]; then
            TAG="${{ inputs.version_tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Selected Release Tag: $TAG"

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_picker.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RootPurge ${{ steps.tag_picker.outputs.tag }}
          body: |
            ### ⚡ RootPurge Release (${{ steps.tag_picker.outputs.tag }})
            
            Ultra-lightweight, blazing-fast root cache cleaner for Android apps and system storage.
            Built with **Google AI Studio**.
            
            #### Highlights:
            - **1-Click Turbo Purge**: Single-session batch root cleaning across `/data/user/0/*/cache`, `code_cache`, `/sdcard/Android/data/*/cache`, and system partitions.
            - **Accurate Storage Calculation**: Real physical size calculation without synthetic estimates.
            - **Ultra-lightweight**: APK file size **~9.3 MB** and runtime RAM **< 15 MB**.
            - **Wallpaper-Themed Monochrome**: Material You dynamic theming with neutral monochrome fallback.
            - **FOSS**: Free and Open Source under the GNU General Public License v3.0 (GPL-3.0).
            
            #### Download:
            - Standalone APK attached below (`RootPurge.apk`).
          files: release-output/RootPurge.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
